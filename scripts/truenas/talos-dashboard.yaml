# TrueNAS custom app (Apps > Discover Apps > ⋮ > Install via YAML): `talosctl dashboard` in the browser via ttyd.
# Talks to the Talos API directly, so it keeps working when Kubernetes is down. Ingress: apps/external/ext-talos.
# Fill in before installing:
#   TTYD_PASSWORD    login password (user: talos)
#   TALOSCONFIG_B64  read-only credential: talosctl config new --roles os:reader --crt-ttl 26280h reader.yaml
#                    then base64 -w0 reader.yaml
# After a Talos upgrade, bump TALOS_VERSION and TALOSCTL_SHA256 (talosctl-linux-amd64 in the release's sha256sum.txt).
services:
  talos-dashboard:
    image: tsl0922/ttyd:1.7.8-alpine@sha256:8f40febae4320ff8a5b6910f6b73513e2645523bede66a8103f3b310288e1a96
    container_name: talos-dashboard
    restart: unless-stopped
    ports:
      - "7681:7681"
    environment:
      TALOS_VERSION: v1.14.5
      TALOSCTL_SHA256: ff432b68986709e6b69c563a08a2ced4232d5196b0dccd6d2e783e9d714d7d7d
      TTYD_PASSWORD: "<password>"
      TALOSCONFIG_B64: "<base64 of the os:reader talosconfig>"
    volumes:
      - talosctl:/opt/talosctl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        B=/opt/talosctl/talosctl-$${TALOS_VERSION}
        if ! echo "$${TALOSCTL_SHA256}  $$B" | sha256sum -c -s 2>/dev/null; then
          echo "downloading talosctl $${TALOS_VERSION}"
          wget -qO "$$B.tmp" "https://github.com/siderolabs/talos/releases/download/$${TALOS_VERSION}/talosctl-linux-amd64"
          echo "$${TALOSCTL_SHA256}  $$B.tmp" | sha256sum -c -s
          mv "$$B.tmp" "$$B"
          chmod +x "$$B"
        fi
        printf '%s' "$${TALOSCONFIG_B64}" | base64 -d > /tmp/talosconfig
        chmod 600 /tmp/talosconfig
        exec ttyd -p 7681 -W -O -m 3 -c "talos:$${TTYD_PASSWORD}" \
          -t titleFixed="Talos dashboard" -t disableLeaveAlert=true \
          "$$B" --talosconfig /tmp/talosconfig -e 192.168.1.35 -n 192.168.1.35 dashboard
volumes:
  talosctl:

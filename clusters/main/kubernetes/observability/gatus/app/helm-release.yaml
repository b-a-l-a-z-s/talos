---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 1h
  chart:
    spec:
      chart: gatus
      version: 5.0.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    # Origin for the public page, which is served by the "status" Cloudflare Worker
    # (scripts/cloudflare/status-proxy.js). Cloudflare blocks direct requests to this host unless
    # they carry the Worker's secret header, so the page is only reachable via workers.dev.
    ingress:
      main:
        enabled: true
        ingressClassName: external
        annotations:
          # Don't monitor itself: the lock would block it; UptimeRobot watches the public page
          gatus.home-operations.com/enabled: "false"
        integrations:
          traefik:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          nginx:
            enabled: false
        hosts:
          - host: status.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix

    # gatus-sidecar writes one endpoint per Ingress. The defaults for each class (group, Discord
    # alerts, hidden URLs/hostnames/errors and, for "internal", Blocky as DNS resolver) come from the
    # IngressClass annotation set via postRenderers in the traefik-internal/-external HelmReleases.
    # Per-Ingress tweaks: gatus.home-operations.com/endpoint annotation; opt out with
    # gatus.home-operations.com/enabled: "false".
    sidecar:
      enable: true
      enableIngress: true
      autoIngress: true

    # History in SQLite on a small PVC instead of a CNPG cluster
    cnpg:
      main:
        enabled: false
    persistence:
      configmain:
        type: emptyDir # sidecar output, regenerated on start
      data:
        enabled: true
        mountPath: /data
        size: 1Gi

    # The webhook is in gatus-discord.secret.yaml (SOPS). The config references the GATUS_DISCORD_WEBHOOK
    # env var, which Gatus expands at load time ($$ escapes Flux substitution), so the URL never lands in
    # the ConfigMap. expandObjectName: false = use that Secret's literal name, not a chart-generated one.
    workload:
      main:
        podSpec:
          containers:
            main:
              envFrom:
                - secretRef:
                    name: gatus-discord-webhook
                    expandObjectName: false

    # The page is public: keep the cluster domain out of everything it shows.
    configmap:
      config:
        enabled: true
        data:
          config.yaml: |
            storage:
              type: sqlite
              path: /data/data.db
            ui:
              title: Status
              header: Status
              link: https://github.com/b-a-l-a-z-s/talos
              buttons:
                - name: GitHub
                  link: https://github.com/b-a-l-a-z-s/talos
            alerting:
              discord:
                webhook-url: $${GATUS_DISCORD_WEBHOOK}
                default-alert:
                  description: health check failed
                  send-on-resolved: true
                  failure-threshold: 3
                  success-threshold: 2
            # Ingress endpoints come from the sidecar; these are the extra, static ones.
            endpoints:
              - name: Cloudflare (1.1.1.1)
                group: Connectivity
                url: icmp://1.1.1.1
                interval: 1m
                conditions:
                  - "[CONNECTED] == true"
              - name: Google (8.8.8.8)
                group: Connectivity
                url: icmp://8.8.8.8
                interval: 1m
                conditions:
                  - "[CONNECTED] == true"
              - name: Quad9 (9.9.9.9)
                group: Connectivity
                url: icmp://9.9.9.9
                interval: 1m
                conditions:
                  - "[CONNECTED] == true"

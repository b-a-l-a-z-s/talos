---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-pve-exporter
  namespace: prometheus-pve-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-pve-exporter
      version: 4.1.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: prometheus-pve-exporter-values
      valuesKey: PVE_USER
      targetPath: pve.credentials.user
    - kind: Secret
      name: prometheus-pve-exporter-values
      valuesKey: PVE_TOKEN_NAME
      targetPath: pve.credentials.tokenName
    - kind: Secret
      name: prometheus-pve-exporter-values
      valuesKey: PVE_TOKEN_VALUE
      targetPath: pve.credentials.tokenValue
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    # Read-only API token: user ${PVE_USER} with role PVEAuditor on "/".
    pve:
      general:
        target: 192.168.1.48 # same host as ext-prox
        verifySsl: false # Proxmox self-signed certificate
    configmap:
      dashboard:
        enabled: false # Grafana downloads its own Proxmox dashboard (observability/grafana)

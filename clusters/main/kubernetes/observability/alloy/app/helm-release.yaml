---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: alloy
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: 1.14.4
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    alloy:
      # Read position of every log file, kept on the node so a restart resumes where it
      # stopped instead of re-sending (or skipping) logs
      storagePath: /var/lib/alloy
      mounts:
        # /var/log from the node: the container log files, read directly from disk like the
        # CrowdSec agent does (no log streaming through the API server)
        varlog: true
        extra:
          - name: alloy-data
            mountPath: /var/lib/alloy
      securityContext:
        # Pod log files are only readable by root
        runAsUser: 0
        runAsGroup: 0
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      configMap:
        content: |
          // Every container of every pod on this node
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            // /var/log/pods/<namespace>_<pod>_<uid>/<container>/0.log
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          // Strip the containerd (CRI) prefix: timestamp, stream, flags
          loki.process "pods" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
    controller:
      type: daemonset
      volumes:
        extra:
          - name: alloy-data
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate

---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: grafana-values
  namespace: grafana
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  # The chart's default is a fixed "testpassword". Keep this a plain value: the chart
  # copies it into its sidecars, which log in as admin to reload dashboards/data sources.
  GRAFANA_ADMIN_PWD: "${GRAFANA_ADMIN_PWD}"
  # Encrypts the credentials Grafana stores in grafana.db (instead of the public default
  # key). Changing it later makes those stored credentials unreadable.
  GRAFANA_SECRET_KEY: "${GRAFANA_SECRET_KEY}"

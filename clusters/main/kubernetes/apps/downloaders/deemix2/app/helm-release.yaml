---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deemix2
  namespace: deemix2
spec:
  interval: 1h
  chart:
    spec:
      chart: deemix
      version: 15.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: deemix2-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: deemix2-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: deemix2-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: deemix2-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: deemix2-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    image:
      repository: ghcr.io/bambanah/deemix
      tag: v4.7.1@sha256:1fa4bdf600d40337abe30d970cfdd4e1a48cac5614742c2f577c3ac5f7092c34
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                DISABLE_OWNERSHIP_CHECK_MUSIC: "true"
                DEEMIX_SINGLE_USER: "true"
    resources:
      requests:
        cpu: 10m
    credentials:
        s3:
          type: s3
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 42 23 * * *
      data:
        enabled: false
      downloads:
        enabled: true
        mountPath: /downloads
        path: /mnt/main/Media/Music/Christine        
        server: 192.168.1.49
        type: nfs
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "christine-deemix.${DOMAIN_0}"  
          hosts:
            - host: christine-deemix.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix   

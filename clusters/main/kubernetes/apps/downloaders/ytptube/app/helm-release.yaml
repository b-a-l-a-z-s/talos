---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ytptube
  namespace: ytptube
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 21.3.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi  
    image:
      repository: ghcr.io/arabcoders/ytptube
      pullPolicy: IfNotPresent
      tag: v2.7.7@sha256:8b406c56502ee501c80254db41ac53465857b136ea1b3dc03da66abf8a1e3587    
    service:
      main:
        ports:
          main:
            port: 8081
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # Authentik (ingress middleware) is the only login
                YTP_DISABLE_AUTH: "true"
    persistence:
      config:
        enabled: true
        mountPath: /config
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 19 3 * * *
      downloads:
        enabled: true
        path: /mnt/main/Media/temp
        mountPath: /downloads
        server: 192.168.1.49
        type: nfs          
    cnpg:
      main:
        enabled: false
    redis:
      enabled: false
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false  
          hosts:
            - host: ytptube.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix

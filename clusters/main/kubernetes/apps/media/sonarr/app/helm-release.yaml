---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: sonarr
spec:
  interval: 1h
  chart:
    spec:
      chart: sonarr
      version: 28.0.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: sonarr-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: sonarr-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: sonarr-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: sonarr-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: sonarr-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 26 3 * * *  
      series:
        enabled: true
        path: /mnt/main/Media/Series
        mountPath: /Videos/Series
        server: 192.168.1.49
        type: nfs    
      mediacompleted:
        enabled: true
        path: /mnt/main/Media/downloads/completed
        mountPath: /media/downloads/completed
        server: 192.168.1.49
        type: nfs      
      recyclebin:
        enabled: true
        path: /mnt/main/Media/Recyclebin
        mountPath: /Recyclebin
        server: 192.168.1.49
        type: nfs                   
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "sonarr.${DOMAIN_0}"    
          hosts:
            - host: sonarr.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix           

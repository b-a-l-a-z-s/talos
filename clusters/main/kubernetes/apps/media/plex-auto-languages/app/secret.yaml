---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: plex-auto-languages-values
  namespace: plex-auto-languages
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  PLEX_TOKEN: ${PLEX_TOKEN}

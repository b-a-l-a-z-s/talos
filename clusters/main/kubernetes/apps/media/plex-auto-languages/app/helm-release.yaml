---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-auto-languages
  namespace: plex-auto-languages
spec:
  interval: 1h
  chart:
    spec:
      chart: plex-auto-languages
      version: 13.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: plex-auto-languages-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: plex-auto-languages-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: plex-auto-languages-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: plex-auto-languages-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: plex-auto-languages-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: plex-auto-languages-values
      valuesKey: PLEX_TOKEN
      targetPath: workload.main.podSpec.containers.main.env.PLEX_TOKEN
  values:
    global:
      stopAll: false  
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 48 1 * * *
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              env:
                PLEX_URL: http://plex.plex.svc.cluster.local:32400         

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sortarr
  namespace: sortarr
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 21.3.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    image:
      repository: ghcr.io/jaredharper1/sortarr
      pullPolicy: IfNotPresent
      tag: v0.9.0@sha256:3e8543522dc199d1157ff1f16aad6dd062a9b410fedc012c43c98d4269719cca
    proxyImage:
      repository: docker.io/library/traefik
      pullPolicy: IfNotPresent
      tag: v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    # traefik-internal reaches a Traefik sidecar, so Sortarr always sees 127.0.0.1 as its proxy
    service:
      main:
        ports:
          main:
            port: 8787
            targetSelector: proxy
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PORT: "8788"
                # Setup UI saves API keys, login and caches here (keys as files under /data/secrets)
                SORTARR_CONFIG_PATH: /data/Sortarr.env
                ENV_FILE_PATH: /data/Sortarr.env
                SORTARR_STORE_SECRETS_AS_FILES: "1"
                SORTARR_ALLOW_PLAINTEXT_SECRETS: "0"
                # Setup defaults for Authentik login; values saved in Setup override these
                # double: traefik-internal + sidecar, so the client IP is the second-last X-Forwarded-For
                SORTARR_PROXY_MODE: double
                SORTARR_AUTH_METHOD: external
                SORTARR_UPSTREAM_AUTH_HEADER: X-authentik-username
                SORTARR_WAITRESS_TRUSTED_PROXY: 127.0.0.1
              # /health needs a login, so check the port instead
              probes:
                liveness:
                  type: tcp
                  port: 8788
                readiness:
                  type: tcp
                  port: 8788
                startup:
                  type: tcp
                  port: 8788
            proxy:
              enabled: true
              primary: false
              imageSelector: proxyImage
              command:
                - traefik
              args:
                - --global.checkNewVersion=false
                - --global.sendAnonymousUsage=false
                - --log.level=WARN
                - --entryPoints.web.address=:8787
                # Keep traefik-internal's X-Forwarded-* (https, client IP) instead of replacing them
                - --entryPoints.web.forwardedHeaders.trustedIPs=172.16.0.0/16
                # WSGI reads X_authentik_username as X-authentik-username: drop such look-alikes
                - --entryPoints.web.http.aliasHeadersStrategy=delete
                - --providers.file.filename=/etc/traefik-proxy/dynamic.yaml
              probes:
                liveness:
                  type: tcp
                  port: 8787
                readiness:
                  type: tcp
                  port: 8787
                startup:
                  type: tcp
                  port: 8787
    configmap:
      proxy:
        enabled: true
        data:
          dynamic.yaml: |
            http:
              routers:
                sortarr:
                  entryPoints:
                    - web
                  rule: PathPrefix(`/`)
                  service: sortarr
              services:
                sortarr:
                  loadBalancer:
                    servers:
                      - url: http://127.0.0.1:8788
    persistence:
      proxy-config:
        enabled: true
        type: configmap
        objectName: proxy
        mountPath: /etc/traefik-proxy
        readOnly: true
        targetSelector:
          main:
            proxy: {}
      data:
        enabled: true
        mountPath: /data
        size: 1Gi
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                # First slot of the gap kept for new apps, after ytptube (UTC, 7 minutes apart)
                schedule: 26 3 * * *
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          nginx:
            enabled: false
        hosts:
          - host: sortarr.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: profilarr
spec:
  interval: 1h
  chart:
    spec:
      chart: profilarr
      version: 5.1.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: profilarr-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: profilarr-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: profilarr-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: profilarr-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: profilarr-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                AUTH: "off"
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 51 2 * * *       
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "profilarr.${DOMAIN_0}" 
          hosts:
            - host: profilarr.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix

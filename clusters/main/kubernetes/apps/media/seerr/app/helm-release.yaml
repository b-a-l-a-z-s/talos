---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: seerr
spec:
  interval: 1h
  chart:
    spec:
      chart: seerr
      version: 17.0.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: seerr-values
      valuesKey: SEERR_CNPG_PWD
      targetPath: cnpg.main.password
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 16 2 * * *
    ingress:
        main:
          enabled: true
          ingressClassName: external
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false   
          hosts:
            - host: seerr.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix
    cnpg:
      main:
        enabled: true
        user: seerr
        database: seerr
        #mode: recovery
        cluster:
          singleNode: true
          # One Postgres pod instead of the chart's two: a replica on the same node adds
          # no availability, and the nightly backup to S3 covers the data.
          instances: 1
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 23 2 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          revision: "1"
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
          revision: "0"               

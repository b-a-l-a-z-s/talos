---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: checkrr
  namespace: checkrr
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 21.3.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: checkrr-values
      valuesKey: SONARR_API_KEY
      targetPath: arrKeys.sonarr
    - kind: Secret
      name: checkrr-values
      valuesKey: RADARR_API_KEY
      targetPath: arrKeys.radarr
    - kind: Secret
      name: checkrr-values
      valuesKey: CHECKRR_DISCORD_WEBHOOK
      targetPath: checkrrNotify.discord
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    image:
      repository: ghcr.io/aetaric/checkrr
      pullPolicy: IfNotPresent
      tag: 3.6.1-amd64@sha256:a2cbd2dfc908fb5620ef1f31e7a99cf9cc706efb1df5fb85e62a33c5d6efcbe3
    service:
      main:
        ports:
          main:
            port: 8585
    workload:
      main:
        podSpec:
          containers:
            main:
              args:
                - -c
                - /config/checkrr.yaml
    # A Secret, not a ConfigMap: the API keys (valuesFrom) are filled in here
    secret:
      config:
        enabled: true
        data:
          # process: true = Sonarr/Radarr delete a bad file (recycle bin, 30 days) and search again
          checkrr.yaml: |
            lang: en-us
            checkrr:
              checkpath:
                - /Videos/Series
                - /Videos/Films
              database: /config/checkrr.db
              csvfile: /config/badfiles.csv
              # 07:00 local, after the nightly backups
              cron: "0 7 * * *"
              debug: false
              ffprobe: true
              ignorehidden: true
              ignoreexts:
                - .txt
                - .nfo
                - .nzb
                - .url
                - .sfv
                - .md5
                - .website
                - .idx
                - .sub
                - .srt
                - .m2ts
                - .ttf
            logs:
              stdout:
                out: stdout
                formatter: default
            arr:
              sonarr:
                process: true
                service: sonarr
                address: sonarr.sonarr.svc.cluster.local
                port: 8989
                apikey: "{{ .Values.arrKeys.sonarr }}"
                baseurl: /
                ssl: false
              radarr:
                process: true
                service: radarr
                address: radarr.radarr.svc.cluster.local
                port: 7878
                apikey: "{{ .Values.arrKeys.radarr }}"
                baseurl: /
                ssl: false
            notifications:
              discord:
                url: "{{ .Values.checkrrNotify.discord }}"
                notificationtypes:
                  - reacquire
                  - unknowndetected
            webserver:
              port: 8585
              tls: false
              baseurl: /
              trustedproxies:
                - 172.16.0.0/16
    persistence:
      config:
        enabled: true
        mountPath: /config
        size: 1Gi
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 33 3 * * *
      checkrr-config:
        enabled: true
        type: secret
        objectName: config
        mountPath: /config/checkrr.yaml
        subPath: checkrr.yaml
        readOnly: true
      # Same paths as in Sonarr/Radarr, so no path mappings are needed
      series:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/Media/Series
        mountPath: /Videos/Series
        readOnly: true
      films:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/Media/Films
        mountPath: /Videos/Films
        readOnly: true
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          nginx:
            enabled: false
        hosts:
          - host: checkrr.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix

---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: checkrr-values
  namespace: checkrr
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  SONARR_API_KEY: "${SONARR_API_KEY}"
  RADARR_API_KEY: "${RADARR_API_KEY}"
  CHECKRR_DISCORD_WEBHOOK: "${CHECKRR_DISCORD_WEBHOOK}"

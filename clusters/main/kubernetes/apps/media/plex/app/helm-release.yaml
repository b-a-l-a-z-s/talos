---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 1h
  chart:
    spec:
      chart: plex
      version: 23.0.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  # Back up the live volume (copyMethod Direct) instead of snapshot + full Longhorn clone: on a single node
  # the clone copies all data on the same disk as etcd and stalled the API server. Only the backup side
  # (ReplicationSource) is patched; the chart's copyMethod would also switch the restore side, so the
  # ReplicationDestination stays on Snapshot and restores/rebuilds keep working.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: volsync.backube
              kind: ReplicationSource
              name: plex-config-b2
            patch: |
              - op: replace
                path: /spec/restic/copyMethod
                value: Direct
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false  
    TZ: Europe/Brussels
    plex:
      serverIP: ${PLEX_IP}
      disableGDM: true
      requireHTTPS: false
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${PLEX_IP}
        integrations:
          metallb:
            enabled: true       
    persistence:
      config:
        size: 200Gi
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 47 4 * * *
      media:
        enabled: true
        path: /mnt/main/Media/
        mountPath: /media
        server: 192.168.1.49
        type: nfs      
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          annotations:
            # Gatus: "/" needs a Plex token (401); /identity is Plex's unauthenticated status endpoint
            gatus.home-operations.com/endpoint: |
              path: /identity
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
          hosts:
            - host: plex.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix      

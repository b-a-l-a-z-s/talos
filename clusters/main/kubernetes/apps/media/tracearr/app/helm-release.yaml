---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
  namespace: tracearr
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 21.0.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: tracearr-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: tracearr-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: tracearr-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: tracearr-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: tracearr-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: tracearr-values
      valuesKey: TRACEARR_JWT_SECRET
      targetPath: workload.main.podSpec.containers.main.env.JWT_SECRET
    - kind: Secret
      name: tracearr-values
      valuesKey: TRACEARR_COOKIE_SECRET
      targetPath: workload.main.podSpec.containers.main.env.COOKIE_SECRET
    - kind: Secret
      name: tracearr-values
      valuesKey: TRACEARR_CNPG_PWD
      targetPath: cnpg.main.password
    - kind: Secret
      name: tracearr-values
      valuesKey: TRACEARR_REDIS_PWD
      targetPath: redis.password
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    image:
      repository: ghcr.io/connorgallopo/tracearr
      pullPolicy: IfNotPresent
      tag: 3.1.1@sha256:d0fe66480953c51da9bf82c3909799e80a4d24165962c747e756be31fcd0fb8f    
    credentials:
      s3:
        type: s3
    securityContext:
      container:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsUser: 0
        runAsGroup: 0
    service:
      main:
        ports:
          main:
            port: 3000
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PORT: "{{ .Values.service.main.ports.main.port }}"
                HOST: 0.0.0.0
                DATABASE_URL:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: std
                DB_PASSWORD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
                REDIS_URL:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                    key: url
                CORS_ORIGIN: "{{ .Values.chartContext.appUrl }}"
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "tracearr.${DOMAIN_0}"               
          hosts:
            - host: tracearr.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix   
    cnpg:
      main:
        enabled: true
        user: tracearr
        database: tracearr
        #mode: recovery
        cluster:
          singleNode: true
          # One Postgres pod instead of the chart's two: a replica on the same node adds
          # no availability, and the nightly backup to S3 covers the data.
          instances: 1
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 44 2 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          revision: "5"
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
          revision: "4"  

    redis:
      enabled: true

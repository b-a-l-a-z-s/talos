---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: tracearr-values
  namespace: tracearr
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  TRACEARR_JWT_SECRET: "${TRACEARR_JWT_SECRET}"
  TRACEARR_COOKIE_SECRET: "${TRACEARR_COOKIE_SECRET}"
  # cnpg.main.password: Unset, it stays at the chart's public PLACEHOLDER default. CNPG only uses it when it
  # creates the database: changing it later also needs ALTER ROLE in Postgres.
  TRACEARR_CNPG_PWD: "${TRACEARR_CNPG_PWD}"
  # redis.password: the chart doesn't generate it (unset = public PLACEHOLDER default).
  # Letters and digits only (it ends up in REDIS_URL).
  TRACEARR_REDIS_PWD: "${TRACEARR_REDIS_PWD}"

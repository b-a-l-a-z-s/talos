---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: radarr
spec:
  interval: 1h
  chart:
    spec:
      chart: radarr
      version: 28.0.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  # Back up the live volume (copyMethod Direct) instead of snapshot + full Longhorn clone: on a single node
  # the clone copies all data on the same disk as etcd and stalled the API server. Only the backup side
  # (ReplicationSource) is patched; the chart's copyMethod would also switch the restore side, so the
  # ReplicationDestination stays on Snapshot and restores/rebuilds keep working.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: volsync.backube
              kind: ReplicationSource
              name: radarr-config-b2
            patch: |
              - op: replace
                path: /spec/restic/copyMethod
                value: Direct
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m   
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 40 4 * * *
      films:
        enabled: true
        path: /mnt/main/Media/Films
        mountPath: /Videos/Films
        server: 192.168.1.49
        type: nfs  
      bin:
        enabled: true
        path: /mnt/main/Media/Recyclebin
        mountPath: /Recyclebin
        server: 192.168.1.49
        type: nfs
      radarrcompleted:
        enabled: true
        path: /mnt/main/Media/downloads/completed
        mountPath: /media/downloads/completed
        server: 192.168.1.49
        type: nfs      
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "radarr.${DOMAIN_0}"  
          hosts:
            - host: radarr.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix          

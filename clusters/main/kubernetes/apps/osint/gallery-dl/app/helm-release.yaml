---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gallery-dl
  namespace: gallery-dl
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.0.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CronJob
            patch: |
              - op: replace
                path: /spec/jobTemplate/spec/backoffLimit
                value: 0
  values:
    TZ: Europe/Brussels
    image:
      repository: docker.io/mikf123/gallery-dl
      pullPolicy: IfNotPresent
      tag: 2026.10.25@sha256:1e111eb6df051cf987af77e26cff472f92698773b8903195a852e585e90432ea
    resources:
      limits:
        memory: 1Gi
    securityContext:
      container:
        runAsUser: 568
        runAsGroup: 568
        readOnlyRootFilesystem: true
    service:
      main:
        enabled: false
    workload:
      main:
        type: CronJob
        schedule: "30 6 * * *"
        suspend: false
        # Overridden to 0 by spec.postRenderers (the chart turns 0 into its default 5)
        backoffLimit: 1
        activeDeadlineSeconds: 14400
        podSpec:
          restartPolicy: Never
          containers:
            main:
              args:
                - --config
                - /secrets/config.json
                - --input-file
                - /secrets/accounts.txt
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
    persistence:
      secrets:
        enabled: true
        type: secret
        objectName: gallery-dl
        expandObjectName: false
        mountPath: /secrets
        readOnly: true
      data:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: ${GALLERY_DL_PATH}
        mountPath: /data

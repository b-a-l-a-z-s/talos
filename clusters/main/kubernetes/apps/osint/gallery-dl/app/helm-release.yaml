---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gallery-dl
  namespace: gallery-dl
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 21.0.14
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CronJob
            patch: |
              - op: replace
                path: /spec/jobTemplate/spec/backoffLimit
                value: 0
  values:
    TZ: Europe/Brussels
    image:
      repository: docker.io/mikf123/gallery-dl
      pullPolicy: IfNotPresent
      tag: 2026.10.31@sha256:96d1cad635e8ca77582b5f4642cc16162ef2dcf82febd4060605e87e3e847420
    resources:
      limits:
        memory: 1Gi
    securityContext:
      container:
        runAsUser: 568
        runAsGroup: 568
        readOnlyRootFilesystem: true
    service:
      main:
        enabled: false
    workload:
      main:
        type: CronJob
        schedule: "30 6 * * *"
        suspend: false
        backoffLimit: 1
        activeDeadlineSeconds: 14400
        podSpec:
          restartPolicy: Never
          containers:
            main:
              args:
                - --config
                - /secrets/config.json
                - --input-file
                - /secrets/accounts.txt
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
      instaloader:
        enabled: true
        type: CronJob
        schedule: "30 7 * * *"
        suspend: false
        backoffLimit: 1
        activeDeadlineSeconds: 14400
        podSpec:
          restartPolicy: Never
          containers:
            instaloader:
              enabled: true
              primary: true
              imageSelector: instaloaderImage
              command: ["sh", "-c"]
              args:
                - >-
                  pip install -q --disable-pip-version-check --target /tmp/pkgs instaloader==4.16rc1
                  && python /scripts/run.py
              env:
                HOME: /tmp
                PYTHONPATH: /tmp/pkgs
                TIME_BUDGET: "10800"
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
    instaloaderImage:
      repository: docker.io/library/python
      pullPolicy: IfNotPresent
      tag: 3.15.2-alpine@sha256:cfb80265c43979455f899ae3fce69b83d51758684b6bc24798ec9b60c67d81d2
    configmap:
      instaloader:
        enabled: true
        data:
          run.py: |
            import http.cookiejar, json, os, sys, time
            import instaloader
            from instaloader import FrozenNodeIterator, Profile, resumable_iteration
            from instaloader.exceptions import AbortDownloadException

            BASE = '/data/Instagram'
            BUDGET = int(os.environ.get('TIME_BUDGET', '10800'))
            START = time.time()

            def log(msg):
                print(time.strftime('%H:%M:%S'), msg, flush=True)

            try:
                with open('/secrets/instaloader.txt') as f:
                    profiles = [l.strip().strip('/').split('/')[-1] for l in f if l.strip() and not l.startswith('#')]
            except FileNotFoundError:
                log('no /secrets/instaloader.txt, nothing to do')
                sys.exit(0)

            L = instaloader.Instaloader(dirname_pattern=BASE + '/{target}', download_video_thumbnails=False,
                                        save_metadata=False, compress_json=False, download_comments=False,
                                        post_metadata_txt_pattern='', quiet=True, max_connection_attempts=3)
            os.makedirs(BASE + '/.complete', exist_ok=True)
            LA = instaloader.Instaloader(dirname_pattern=BASE + '/{target}', quiet=True, max_connection_attempts=3,
                                         iphone_support=False)
            try:
                jar = http.cookiejar.MozillaCookieJar('/secrets/cookies.txt')
                jar.load(ignore_discard=True, ignore_expires=True)
                LA.context._session.cookies.update(jar)
                LA.context.username = LA.test_login()
            except Exception as e:
                log(f'cookies: {type(e).__name__}: {e}')
            if not LA.context.username:
                log('cookies not working, avatars logged out')
                LA = L
            public = []
            for name in profiles:
                try:
                    profile = Profile.from_username(L.context, name)
                    LA.download_profilepic(profile if LA is L else Profile.from_username(LA.context, name))
                    if profile.is_private:
                        log(f'{name}: private, avatar only')
                    else:
                        public.append((name, profile))
                except Exception as e:
                    log(f'{name}: {type(e).__name__}: {e}')
            out_of_time = False
            for name, profile in public:
                if out_of_time:
                    break
                try:
                    marker = f'{BASE}/.complete/{name}'
                    posts = profile.get_posts()
                    new = known = 0
                    if os.path.exists(marker):
                        for post in posts:
                            if L.download_post(post, target=name):
                                new, known = new + 1, 0
                            else:
                                known += 1
                                if known >= 3:
                                    break
                    else:
                        try:
                            with resumable_iteration(
                                    context=L.context, iterator=posts,
                                    load=lambda _, path: FrozenNodeIterator(**json.load(open(path))),
                                    save=lambda fni, path: json.dump(fni._asdict(), open(path, 'w')),
                                    format_path=lambda magic: f'{BASE}/.resume/{name}_{magic}.json') as (resuming, _):
                                if resuming:
                                    log(f'{name}: resuming the first full download')
                                for post in posts:
                                    if L.download_post(post, target=name):
                                        new += 1
                                    if time.time() - START > BUDGET:
                                        raise AbortDownloadException('time budget used up')
                            open(marker, 'w').close()
                            log(f'{name}: first full download complete')
                        except AbortDownloadException:
                            out_of_time = True
                            log(f'{name}: stopped for tonight, continues next run')
                    log(f'{name}: {new} new post(s)')
                except Exception as e:
                    log(f'{name}: {type(e).__name__}: {e}')
    persistence:
      secrets:
        enabled: true
        type: secret
        objectName: gallery-dl
        expandObjectName: false
        mountPath: /secrets
        readOnly: true
        targetSelector:
          main:
            main: {}
          instaloader:
            instaloader: {}
      data:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: ${GALLERY_DL_PATH}
        mountPath: /data
        targetSelector:
          main:
            main: {}
          instaloader:
            instaloader: {}
      instaloader-script:
        enabled: true
        type: configmap
        objectName: instaloader
        mountPath: /scripts
        readOnly: true
        targetSelector:
          instaloader:
            instaloader: {}

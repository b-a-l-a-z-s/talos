apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: toolbox
resources:
  - namespace.yaml
  - helm-release.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: osint-toolbox-configmap
    files:
      - app.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 1h
  chart:
    spec:
      chart: pihole
      version: 23.1.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: pihole-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: pihole-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: pihole-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: pihole-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: pihole-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    service:
      dns:
        type: LoadBalancer
        loadBalancerIP: ${PIHOLE_IP} 
        integrations:
          metallb:
            enabled: true      
    credentials:
      s3:
        type: s3
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 30 2 * * *  
      dnsmasq:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 37 2 * * *
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                FTLCONF_dns_upstreams: ${BLOCKY_IP}
                FTLCONF_webserver_api_password: ''
                # Without a password Pi-hole only answers this name, IPs and localhost (2026.10.0)
                FTLCONF_webserver_domain: pihole.${DOMAIN_0}
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
              - name: strip-sec-fetch-site
                namespace: pihole
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "pihole.${DOMAIN_0}"   
          hosts:
            - host: pihole.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix   

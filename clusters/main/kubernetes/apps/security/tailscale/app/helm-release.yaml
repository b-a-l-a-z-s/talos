---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale
      version: 13.1.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: tailscale-values
      valuesKey: TAILSCALE_AUTH_KEY
      targetPath: tailscale.authkey
  values: 
    global:
      stopAll: false
    TZ: Europe/Brussels  
    resources:
      requests:
        cpu: 10m       
    tailscale:
      auth_once: false
      userspace: true
      accept_dns: true
      routes: 192.168.1.0/24
      dest_ip: ""
      advertise_as_exit_node: true
      

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 1h
  chart:
    spec:
      chart: vaultwarden
      version: 31.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: vaultwarden-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: vaultwarden-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: vaultwarden-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: vaultwarden-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: vaultwarden-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: vaultwarden-values
      valuesKey: VW_TOKEN_VALUES
    - kind: Secret
      name: vaultwarden-values
      valuesKey: VW_SMTP_PWD
      targetPath: vaultwarden.smtp.password
    - kind: Secret
      name: vaultwarden-values
      valuesKey: VAULTWARDEN_CNPG_PWD
      targetPath: cnpg.main.password
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
    vaultwarden:
      allowSignups: false
      verifySignup: false
      requireEmail: false
      allowInvitation: true
      showPasswordHint: false
      enableWebVault: true
      admin:
        enabled: true
        disableAdminToken: false
      smtp:
        enabled: true
        host: smtp.gmail.com
        from: ${DOMAIN_0_EMAIL}
        fromName: Balazs
        security: starttls
        port: 587
        heloName: Vault
        timeout: 15
        invalidHostname: false
        invalidCertificate: false
        user: ${DOMAIN_0_EMAIL}
      # CrowdSec (Dominic-Wagner/vaultwarden) reads these logs:
      log:
        level: info
        timeFormat: "%Y-%m-%d %H:%M:%S.%3f%z"
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # Log the real visitor IP. Traefik's X-Real-Ip (Vaultwarden's default) is the
                # cloudflared pod, which CrowdSec's whitelist drops. Only trustworthy if all
                # external traffic arrives through the Cloudflare tunnel.
                IP_HEADER: CF-Connecting-IP      
    persistence:
      data:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 47 3 * * *
    cnpg:
      main:
        cluster:
          singleNode: true
          # One Postgres pod instead of the chart's two: a replica on the same node adds
          # no availability, and the nightly backup to S3 covers the data.
          instances: 1
        #mode: recovery
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 54 3 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
    ingress:
        main:
          enabled: true
          ingressClassName: external
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false   
          hosts:
            - host: vault.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix             

---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-values
  namespace: vaultwarden
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  VW_SMTP_PWD: "${VW_SMTP_PWD}"
  VAULTWARDEN_CNPG_PWD: "${VAULTWARDEN_CNPG_PWD}"
  VW_TOKEN_VALUES: |
    vaultwarden:
      admin:
        token: '${VW_TOKEN}'

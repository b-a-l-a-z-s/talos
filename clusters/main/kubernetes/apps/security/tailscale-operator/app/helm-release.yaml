---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  # OAuth credentials come from the operator-oauth Secret (secret.yaml), not from values
  values:
    operatorConfig:
      resources:
        requests:
          cpu: 10m
    ingressClass:
      enabled: false

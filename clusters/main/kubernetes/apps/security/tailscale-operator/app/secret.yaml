---
# Trust credential (tag:k8s-operator) that the chart mounts when oauth.clientId is empty
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale-operator
type: Opaque
stringData:
  client_id: "${TAILSCALE_OPERATOR_CLIENT_ID}"
  client_secret: "${TAILSCALE_OPERATOR_CLIENT_SECRET}"

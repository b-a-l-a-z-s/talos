---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: 42.0.11
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: authentik-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: authentik-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: authentik-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: authentik-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: authentik-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: authentik-values
      valuesKey: AUTHENTIK_CNPG_PWD
      targetPath: cnpg.main.password
    - kind: Secret
      name: authentik-values
      valuesKey: AUTHENTIK_REDIS_PWD
      targetPath: redis.password
    - kind: Secret
      name: authentik-values
      valuesKey: AUTHENTIK_PWD
      targetPath: authentik.credentials.password
    - kind: Secret
      name: authentik-values
      valuesKey: GMAIL_USER
      targetPath: authentik.email.username
    - kind: Secret
      name: authentik-values
      valuesKey: AUTHENTIK_SMTP_PWD
      targetPath: authentik.email.password
    - kind: Secret
      name: authentik-values
      valuesKey: GMAIL_USER
      targetPath: authentik.email.from
  values:    
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
    persistence:
      media:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 0 23 * * *
      templates:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 0 23 * * *
      blueprints:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 0 23 * * *
      certs:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 0 23 * * *
      geoip:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 0 23 * * *
    cnpg:
      main:
        cluster:
          singleNode: true
          # One Postgres pod instead of the chart's two: a replica on the same node adds
          # no availability, and the nightly backup to S3 covers the data.
          instances: 1
        #mode: recovery
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 0 23 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          revision: "10"
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
          revision: "9"       
    authentik:
      credentials:
        email: ${DOMAIN_0_EMAIL}
      email:
        host: smtp.gmail.com
        port: 587
        useTLS: true
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          targetSelector: #for traefik
            http: http    #for traefik
          #annotations:   #for nginx                                      
          #  nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"  #for nginx
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false  
          hosts:
            - host: auth.${DOMAIN_0}
            # Per-app /outpost.goauthentik.io routes are no longer needed: with Traefik, the
            # "authentik" forward-auth middleware on each app sends these paths to the outpost
            # itself (it handles the login callback and sign-out). Leftovers from nginx.
            # - host: "balazs-deemix.${DOMAIN_0}"
              # paths:
                # - path: /outpost.goauthentik.io
                  # pathType: ImplementationSpecific
            # - host: "tc.${DOMAIN_0}"
              # paths:
                # - path: /outpost.goauthentik.io
                  # pathType: ImplementationSpecific

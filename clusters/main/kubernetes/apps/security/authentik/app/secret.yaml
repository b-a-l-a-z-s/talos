---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: authentik-values
  namespace: authentik
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  AUTHENTIK_CNPG_PWD: "${AUTHENTIK_CNPG_PWD}"
  AUTHENTIK_REDIS_PWD: "${AUTHENTIK_REDIS_PWD}"
  AUTHENTIK_PWD: "${AUTHENTIK_PWD}"
  GMAIL_USER: "${GMAIL_USER}"
  AUTHENTIK_SMTP_PWD: "${AUTHENTIK_SMTP_PWD}"

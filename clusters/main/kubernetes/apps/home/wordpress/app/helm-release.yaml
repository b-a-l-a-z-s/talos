---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  interval: 1h
  chart:
    spec:
      chart: wordpress
      version: 15.0.12
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  # Public website on the second domain's apex (no subdomain), through the Cloudflare Tunnel and
  # traefik-external, so CrowdSec covers it. Bitnami WordPress image.
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: wordpress-values
      valuesKey: WORDPRESS_ADMIN_USER
      targetPath: wordpress.user
    - kind: Secret
      name: wordpress-values
      valuesKey: WORDPRESS_ADMIN_PWD
      targetPath: wordpress.pass
    - kind: Secret
      name: wordpress-values
      valuesKey: WORDPRESS_MARIADB_PWD
      targetPath: mariadb.password
    - kind: Secret
      name: wordpress-values
      valuesKey: WORDPRESS_MARIADB_ROOT_PWD
      targetPath: mariadb.rootPassword
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: mariadb.credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: mariadb.credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: mariadb.credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: mariadb.credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: mariadb.credentials.s3.encrKey
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    wordpress:
      # Admin account, created on the first start only (an empty volume). Change the password or
      # add accounts in WordPress itself afterwards; editing these values then does nothing.
      email: "${DOMAIN_2_EMAIL}"
      first_name: Admin
      last_name: Admin
      blog_name: "${DOMAIN_2}"
    php-config:
      # Room for the WordPress.com export file and media uploads. The importer also downloads
      # every attachment from the old site in the same request, which takes a while.
      PHP_UPLOAD_MAX_FILESIZE: 128M
      PHP_POST_MAX_SIZE: 128M
      PHP_MAX_EXECUTION_TIME: "300"
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # wp-config.php keeps the database password it was installed with. This makes the
                # image rewrite the database settings from the chart's values on every start.
                WORDPRESS_OVERRIDE_DATABASE_SETTINGS: "yes"
                # The override "restores" the permissions of the wp-config.php symlink (777) onto the
                # real file; this runs after it and sets the file back to 440 (wp-content 775/664).
                WORDPRESS_RESET_DATA_PERMISSIONS: "yes"
    configmap:
      php-hardening:
        enabled: true
        data:
          # CVE-2026-109619 (upload progress) and CVE-2026-109618 (deeply nested input); WordPress needs neither
          zz-php-hardening.ini: |
            session.upload_progress.enabled = Off
            max_input_nesting_level = 10
    persistence:
      php-hardening:
        enabled: true
        type: configmap
        objectName: php-hardening
        mountPath: /opt/bitnami/php/etc/conf.d/zz-php-hardening.ini
        subPath: zz-php-hardening.ini
        readOnly: true
      # wp-content (themes, plugins, uploads) and wp-config.php
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                # Free slot after Plex at the end of the nightly chain (UTC, 7 minutes apart)
                schedule: 5 3 * * *
    mariadb:
      # The sub-chart doesn't see the parent's credentials, so it gets its own copy
      credentials:
        s3:
          type: s3
      persistence:
        data:
          volsync:
            - name: b2
              type: restic
              credentials: s3
              dest:
                enabled: true
              src:
                enabled: true
                trigger:
                  # 05:05 is qbittorrent's (disabled) slot; keep 7 minutes from it
                  schedule: 12 3 * * *
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          traefik:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-2-le-prod
          nginx:
            enabled: false
        hosts:
          - host: ${DOMAIN_2}
            paths:
              - path: /
                pathType: Prefix

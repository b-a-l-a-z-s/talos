---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-values
  namespace: wordpress
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  WORDPRESS_ADMIN_USER: "${WORDPRESS_ADMIN_USER}"
  WORDPRESS_ADMIN_PWD: "${WORDPRESS_ADMIN_PWD}"
  # mariadb.password/rootPassword: the chart doesn't generate these (unset = public PLACEHOLDER defaults).
  # MariaDB re-applies them on every start (--init-file). Letters and digits only.
  WORDPRESS_MARIADB_PWD: "${WORDPRESS_MARIADB_PWD}"
  WORDPRESS_MARIADB_ROOT_PWD: "${WORDPRESS_MARIADB_ROOT_PWD}"

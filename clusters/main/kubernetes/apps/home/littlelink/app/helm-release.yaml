---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: littlelink
  namespace: littlelink
spec:
  interval: 1h
  chart:
    spec:
      chart: littlelink
      version: 19.1.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Brussels
    configmap:
      theme:
        enabled: true
        data:
          dark.css: |
            :root {
              --bg-color: #292929;
              --hr-color: #F1F1F1;
              --code-color: #F1F1F1;
              --font-color: #FFFFFF;
              --a-color: #0085FF;
              --border-color: #292929;
              --button-border-style: none;
            }
            /* page.js adds a random photo from the "background" Worker; without it only the dark colour */
            body {
              background: var(--bg-color) linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)) center / cover fixed;
            }
            .photo-credit {
              position: fixed;
              right: 10px;
              bottom: 6px;
              font-size: 11px;
              color: rgba(255, 255, 255, 0.75);
              text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            }
            .photo-credit a {
              color: inherit;
            }
            #root {
              padding-top: 6vh;
            }
            /* Click/tap the avatar to switch to a QR code of this page and back (page.js, qr.secret.yaml) */
            img.avatar {
              cursor: pointer;
              transform-origin: center bottom;
              transition: transform 0.2s ease, border-radius 0.2s ease;
            }
            img.avatar.show-qr {
              object-position: -99999px 0;
              background: #fff url("/qr.svg") center / 100% no-repeat;
              border-radius: 8px;
              transform: scale(1.5);
            }
          page.js: |
            // Random Unsplash photo as background, with the photographer credit Unsplash asks for
            (function () {
              function link(text, href) {
                var a = document.createElement('a');
                a.href = href;
                a.textContent = text;
                a.target = '_blank';
                a.rel = 'noopener';
                return a;
              }
              function setBackground() {
                fetch('https://background.b-a-l-a-z-s.workers.dev/photo.json', { cache: 'no-store' })
                  .then(function (r) { return r.json(); })
                  .then(function (p) {
                    var img = new Image();
                    img.onload = function () {
                      document.body.style.backgroundImage =
                        'linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url("' + p.image + '")';
                    };
                    img.src = p.image;
                    if (!p.name) return;
                    var credit = document.createElement('div');
                    credit.className = 'photo-credit';
                    credit.append(link('Photo', p.link), ' by ', link(p.name, p.profile), ' on ',
                      link('Unsplash', 'https://unsplash.com/?utm_source=homelab_background&utm_medium=referral'));
                    document.body.appendChild(credit);
                  })
                  .catch(function () {});
              }
              if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setBackground);
              else setBackground();
            })();
            // Click/tap the avatar to switch to a QR code of this page and back
            document.addEventListener('click', function (e) {
              var avatar = e.target.closest && e.target.closest('img.avatar');
              if (avatar) avatar.classList.toggle('show-qr');
            });
    persistence:
      theme:
        enabled: true
        type: configmap
        objectName: theme
        mountPath: /usr/src/app/build/public/css/dark.css
        subPath: dark.css
        readOnly: true
      page-js:
        enabled: true
        type: configmap
        objectName: theme
        mountPath: /usr/src/app/build/public/page.js
        subPath: page.js
        readOnly: true
      qr:
        enabled: true
        type: secret
        objectName: littlelink-qr
        expandObjectName: false
        mountPath: /usr/src/app/build/public/qr.svg
        subPath: qr.svg
        readOnly: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                META_TITLE: ${LITTLELINK_NAME}
                META_DESCRIPTION: ${LITTLELINK_BIO}
                META_AUTHOR: ${LITTLELINK_NAME}
                META_INDEX_STATUS: noindex
                THEME: Dark
                AVATAR_URL: https://gravatar.com/avatar/${LITTLELINK_GRAVATAR}?s=128
                AVATAR_2X_URL: https://gravatar.com/avatar/${LITTLELINK_GRAVATAR}?s=256
                AVATAR_ALT: ${LITTLELINK_NAME}
                NAME: ${LITTLELINK_NAME}
                BIO: ${LITTLELINK_BIO}
                BUTTON_ORDER: FACEBOOK,INSTAGRAM,MEMORIES,LINKED_IN,YOUTUBE,STRAVA,GITHUB
                # Lychee
                CUSTOM_BUTTON_NAME: MEMORIES
                CUSTOM_BUTTON_TEXT: Memories
                CUSTOM_BUTTON_URL: https://memories.${DOMAIN_1}
                CUSTOM_BUTTON_COLOR: "#2293EC"
                CUSTOM_BUTTON_TEXT_COLOR: "#FFFFFF"
                CUSTOM_BUTTON_ALT_TEXT: Memories photo gallery
                CUSTOM_BUTTON_ICON: fas fa-images
                # No analytics: the Plausible script slot is the only way to load our own JS (page.js)
                PLAUSIBLE_URL: /page.js
                PLAUSIBLE_DATA_DOMAIN: none
                PLAUSIBLE_DATA_API: none
                GITHUB: https://github.com/b-a-l-a-z-s
                #PIXELFED: ${LITTLELINK_PIXELFED}
                INSTAGRAM: ${LITTLELINK_INSTAGRAM}
                FACEBOOK: ${LITTLELINK_FACEBOOK}
                YOUTUBE: ${LITTLELINK_YOUTUBE}
                LINKED_IN: ${LITTLELINK_LINKEDIN}
                STRAVA: ${LITTLELINK_STRAVA}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          traefik:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
          nginx:
            enabled: false
        hosts:
          - host: ${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix

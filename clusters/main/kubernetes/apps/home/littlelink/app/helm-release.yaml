---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: littlelink
  namespace: littlelink
spec:
  interval: 15m
  chart:
    spec:
      chart: littlelink
      version: 19.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Brussels
    configmap:
      theme:
        enabled: true
        data:
          dark.css: |
            :root {
              --bg-color: #292929;
              --hr-color: #F1F1F1;
              --code-color: #F1F1F1;
              --font-color: #FFFFFF;
              --a-color: #0085FF;
              --border-color: #292929;
              --button-border-style: none;
            }
            body {
              background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url("https://picsum.photos/1920/1080") center / cover fixed;
            }
            #root {
              padding-top: 6vh;
            }
            /* Click/tap the avatar to switch to a QR code of this page and back (qr-toggle.js, qr.secret.yaml) */
            img.avatar {
              cursor: pointer;
              transform-origin: center bottom;
              transition: transform 0.2s ease, border-radius 0.2s ease;
            }
            img.avatar.show-qr {
              object-position: -99999px 0;
              background: #fff url("/qr.svg") center / 100% no-repeat;
              border-radius: 8px;
              transform: scale(1.5);
            }
          qr-toggle.js: |
            document.addEventListener('click', function (e) {
              var avatar = e.target.closest && e.target.closest('img.avatar');
              if (avatar) avatar.classList.toggle('show-qr');
            });
    persistence:
      theme:
        enabled: true
        type: configmap
        objectName: theme
        mountPath: /usr/src/app/build/public/css/dark.css
        subPath: dark.css
        readOnly: true
      qr-toggle:
        enabled: true
        type: configmap
        objectName: theme
        mountPath: /usr/src/app/build/public/qr-toggle.js
        subPath: qr-toggle.js
        readOnly: true
      qr:
        enabled: true
        type: secret
        objectName: littlelink-qr
        expandObjectName: false
        mountPath: /usr/src/app/build/public/qr.svg
        subPath: qr.svg
        readOnly: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                META_TITLE: ${LITTLELINK_NAME}
                META_DESCRIPTION: ${LITTLELINK_BIO}
                META_AUTHOR: ${LITTLELINK_NAME}
                META_INDEX_STATUS: noindex
                THEME: Dark
                AVATAR_URL: https://gravatar.com/avatar/${LITTLELINK_GRAVATAR}?s=128
                AVATAR_2X_URL: https://gravatar.com/avatar/${LITTLELINK_GRAVATAR}?s=256
                AVATAR_ALT: ${LITTLELINK_NAME}
                NAME: ${LITTLELINK_NAME}
                BIO: ${LITTLELINK_BIO}
                BUTTON_ORDER: FACEBOOK,INSTAGRAM,MEMORIES,LINKED_IN,YOUTUBE,STRAVA,GITHUB
                # Lychee
                CUSTOM_BUTTON_NAME: MEMORIES
                CUSTOM_BUTTON_TEXT: Memories
                CUSTOM_BUTTON_URL: https://memories.${DOMAIN_1}
                CUSTOM_BUTTON_COLOR: "#2293EC"
                CUSTOM_BUTTON_TEXT_COLOR: "#FFFFFF"
                CUSTOM_BUTTON_ALT_TEXT: Memories photo gallery
                CUSTOM_BUTTON_ICON: fas fa-images
                # No analytics: the Plausible script slot is the only way to load our own JS (qr-toggle.js)
                PLAUSIBLE_URL: /qr-toggle.js
                PLAUSIBLE_DATA_DOMAIN: none
                PLAUSIBLE_DATA_API: none
                GITHUB: https://github.com/b-a-l-a-z-s
                #PIXELFED: ${LITTLELINK_PIXELFED}
                INSTAGRAM: ${LITTLELINK_INSTAGRAM}
                FACEBOOK: ${LITTLELINK_FACEBOOK}
                YOUTUBE: ${LITTLELINK_YOUTUBE}
                LINKED_IN: ${LITTLELINK_LINKEDIN}
                STRAVA: ${LITTLELINK_STRAVA}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          traefik:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
          nginx:
            enabled: false
        hosts:
          - host: ${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix

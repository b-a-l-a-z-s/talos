---
# guacd opens the RDP/VNC sessions. Limit it to the machines Guacamole has a connection
# for, so a hijacked session (the only user is an admin and could add connections) can't
# reach the rest of the LAN or the cluster. Add a machine here when you add a connection.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guacd
  namespace: guacamole
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: guacamole
      pod.name: guacd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the Guacamole web app talks to guacd
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: guacamole
              pod.name: main
      ports:
        - protocol: TCP
          port: 10124
  egress:
    # RDP connections
    - to:
        - ipBlock:
            cidr: 192.168.1.5/32
        - ipBlock:
            cidr: 192.168.1.26/32
      ports:
        - protocol: TCP
          port: 3389
    # VNC connections
    - to:
        - ipBlock:
            cidr: 192.168.1.6/32
      ports:
        - protocol: TCP
          port: 5900
    # VNC to tailnet devices: the operator's egress proxies for tailnet-egress.yaml
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-operator
          podSelector:
            matchLabels:
              tailscale.com/parent-resource-ns: guacamole
            matchExpressions:
              - key: tailscale.com/parent-resource
                operator: In
                values: [family-pc, christine-big]
      ports:
        - protocol: TCP
          port: 5900
    # The chart's init container waits for the database before guacd starts
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: guacamole-cnpg-main
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The web app only needs guacd, its database and DNS: no direct way into the LAN or the
# Kubernetes API if Guacamole itself were compromised. Reachable only through traefik-external
# (Cloudflare Access) and the Homarr/Gatus status checks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guacamole-web
  namespace: guacamole
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: guacamole
      pod.name: main
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-external
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homarr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: guacamole
              pod.name: guacd
      ports:
        - protocol: TCP
          port: 10124
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: guacamole-cnpg-main
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Postgres only accepts Guacamole (web app and guacd's start-up check), its own instances, the
# CNPG operator and Prometheus (metrics)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guacamole-cnpg
  namespace: guacamole
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: guacamole-cnpg-main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: guacamole
        - podSelector:
            matchLabels:
              cnpg.io/cluster: guacamole-cnpg-main
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187

---
# Tailnet devices for Guacamole (operator egress proxies), e.g. family-pc.guacamole.svc.cluster.local:5900
# The operator rewrites externalName, so Flux only creates these Services: delete one to apply changes
apiVersion: v1
kind: Service
metadata:
  name: family-pc
  namespace: guacamole
  annotations:
    tailscale.com/tailnet-fqdn: "${FAMILY_PC_TAILNET_FQDN}"
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  type: ExternalName
  externalName: placeholder
---
apiVersion: v1
kind: Service
metadata:
  name: christine-big
  namespace: guacamole
  annotations:
    tailscale.com/tailnet-fqdn: "${CHRISTINE_BIG_TAILNET_FQDN}"
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  type: ExternalName
  externalName: placeholder

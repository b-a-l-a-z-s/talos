---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: guacamole-values
  namespace: guacamole
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  GUACAMOLE_CNPG_PWD: "${GUACAMOLE_CNPG_PWD}"

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  interval: 1h
  chart:
    spec:
      chart: mosquitto
      version: 19.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    persistence:
      data:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 6 1 * * *
      configinc:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 13 1 * * *
    auth:
      enabled: true
    # The chart creates a websockets Service by default, but the broker only listens there with
    # websockets.enabled: true. Nothing uses websockets (HA and Frigate use 1883), so drop the Service.
    service:
      websockets:
        enabled: false
    # Probe by checking that 1883 is in LISTEN state (075B = 1883, 0A = LISTEN) instead of opening a
    # TCP connection: the chart's tcp probes made Mosquitto log "New connection ... closed its
    # connection" about every 7 s.
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - "grep -qE '^ *[0-9]+: [0-9A-F]+:075B [0-9A-F]+:0000 0A ' /proc/net/tcp /proc/net/tcp6"
                readiness:
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - "grep -qE '^ *[0-9]+: [0-9A-F]+:075B [0-9A-F]+:0000 0A ' /proc/net/tcp /proc/net/tcp6"
                startup:
                  type: exec
                  command:
                    - /bin/sh
                    - -c
                    - "grep -qE '^ *[0-9]+: [0-9A-F]+:075B [0-9A-F]+:0000 0A ' /proc/net/tcp /proc/net/tcp6"

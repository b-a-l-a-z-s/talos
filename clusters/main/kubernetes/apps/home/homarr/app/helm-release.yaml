---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
  namespace: homarr
spec:
  interval: 1h
  chart:
    spec:
      chart: homarr
      version: 17.5.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: homarr-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: homarr-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: homarr-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: homarr-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: homarr-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: homarr-values
      valuesKey: homarr
      targetPath: workload.main.podSpec.containers.main.env.SECRET_ENCRYPTION_KEY
  values:
#    addons:
#      codeserver:
#        enabled: true
#        service:
#          type: "LoadBalancer"
#          loadBalancerIP: "192.168.1.70"
#          ports:
#            codeserver:
#              port: 12321
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    credentials:
      s3:
        type: s3
    persistence:
      appdata:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 42 23 * * *
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false   
          hosts:
            - host: homarr.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix   

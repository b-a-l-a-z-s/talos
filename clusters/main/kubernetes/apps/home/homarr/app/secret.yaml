---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: homarr-values
  namespace: homarr
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  S3URL: ${S3URL}
  BUCKET: ${S3PREFIX}-homarr
  S3ID: ${S3ID}
  S3KEY: ${S3KEY}
  homarr: "${homarr}"

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 1h
  chart:
    spec:
      chart: nextcloud
      version: 49.0.19
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: nextcloud-values
      valuesKey: NEXTCLOUD_USER
      targetPath: nextcloud.credentials.initialAdminUser
    - kind: Secret
      name: nextcloud-values
      valuesKey: NEXTCLOUD_PWD
      targetPath: nextcloud.credentials.initialAdminPassword
    - kind: Secret
      name: nextcloud-values
      valuesKey: COLLABORA_USER
      targetPath: nextcloud.collabora.username
    - kind: Secret
      name: nextcloud-values
      valuesKey: COLLABORA_PWD
      targetPath: nextcloud.collabora.password
    - kind: Secret
      name: nextcloud-values
      valuesKey: NEXTCLOUD_CNPG_PWD
      targetPath: cnpg.main.password
    - kind: Secret
      name: nextcloud-values
      valuesKey: NEXTCLOUD_REDIS_PWD
      targetPath: redis.password
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 25m
    nextcloud:
      general:
        default_phone_region: BE
        accessIP: ${NGINX_EXTERNAL_IP}
      # Memories' recommended providers, rendered locally (Imagick, ffmpeg) instead of by Imaginary
      previews:
        imaginary: false
        schedule: "*/30 * * * *"
        providers: [Image, HEIC, TIFF, Movie, MKV, MP4, AVI]
      #  max_memory: 5120
      #  max_file_size_image: 100
      collabora:
        enabled: true
      # memory_limit and opcache stay at the chart defaults (1G, 128 MB).
      # Workers sized for the 4500Mi container (chart default 180 would OOM it).
      php:
        upload_limit: 20G
        pm_max_children: 24
        pm_start_servers: 6
        pm_min_spare_servers: 4
        pm_max_spare_servers: 12
      logging:
        # ISO 8601 with UTC offset, the format CrowdSec's nextcloud parser expects.
        # The chart default (d/m/Y H:i:s) has no timezone and is ambiguous.
        log_date_format: "c"
    # The chart's cron jobs (list replaces the default). preview-cron first scans each user's Memories
    # timeline folders for files added on the SMB shares outside Nextcloud, then indexes and previews them.
    cronjobs:
      - name: nextcloud-cron
        enabled: true
        schedule: "*/5 * * * *"
        cmd:
          - echo "Running [php -f /var/www/html/cron.php] ..."
          - php -f /var/www/html/cron.php
          - echo "Finished [php -f /var/www/html/cron.php]"
      - name: preview-cron
        enabled: "{{ .Values.nextcloud.previews.cron }}"
        schedule: "{{ .Values.nextcloud.previews.schedule }}"
        cmd:
          - for u in $(occ user:list | sed -n 's/^  - \([^:]*\):.*/\1/p'); do occ user:setting "$u" memories timelinePath 2>/dev/null | tr ';' '\n' | while read -r p; do [ -n "$p" ] && [ "$p" != / ] && occ files:scan --path="/$u/files$p" | tail -2 | head -1; done; done
          - occ memories:index
          - occ preview:pre-generate
          - echo "Finished [scan, memories:index, preview:pre-generate]"
    workload:
      main:
        podSpec:
          containers:
            main:
              resources:
                limits:
                  # 3000Mi was OOM-killed by previews of a batch of large photos
                  memory: 4500Mi
            # Streams nextcloud.log (on the NFS data volume) to stdout so CrowdSec can
            # read it. Reuses the Nextcloud image and runs as the same user.
            logtail:
              enabled: true
              primary: false
              imageSelector: image
              command:
                - tail
                - -n
                - "0"
                - -F
                - /var/www/html/data/logs/nextcloud.log
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi         
    configmap:
      php-hardening:
        enabled: true
        data:
          # PHP2Shell (CVE-2026-109618/-109619) until PHP 8.5.12; Nextcloud needs none of these
          zz-php-hardening.ini: |
            session.upload_progress.enabled = Off
            max_input_nesting_level = 10
            fatal_error_backtraces = Off
      previews-config:
        enabled: true
        data:
          # At most 2 new previews at once (default: CPU count, 8); a 200 MP photo needs ~1 GB
          zz-previews.config.php: |
            <?php
            $CONFIG = [
              'preview_concurrency_new' => 2,
            ];
    persistence:
      php-hardening:
        enabled: true
        type: configmap
        objectName: php-hardening
        mountPath: /usr/local/etc/php/conf.d/zz-php-hardening.ini
        subPath: zz-php-hardening.ini
        readOnly: true
      previews-config:
        enabled: true
        type: configmap
        objectName: previews-config
        mountPath: /var/www/html/config/zz-previews.config.php
        subPath: zz-previews.config.php
        readOnly: true
      html:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 19 4 * * *
      config:  
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 26 4 * * *
      data:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/apps/nextcloud/nc_data
        mountPath: /var/www/html/data
        targetSelector:
          main:
            # Adds the mount to the logtail sidecar; the chart's own mounts are kept
            logtail:
              mountPath: /var/www/html/data
              readOnly: true                
    cnpg:
      main:
        cluster:
          singleNode: true
          # One Postgres pod instead of the chart's two: a replica on the same node adds
          # no availability, and the nightly backup to S3 covers the data.
          instances: 1
        #mode: recovery
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 33 4 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
    ingress:
        main:
          enabled: true
          ingressClassName: external
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false   
          hosts:
            - host: next.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix   

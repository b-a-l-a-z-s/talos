---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-values
  namespace: nextcloud
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  NEXTCLOUD_USER: "${NEXTCLOUD_USER}"
  NEXTCLOUD_PWD: "${NEXTCLOUD_PWD}"
  COLLABORA_USER: "${COLLABORA_USER}"
  COLLABORA_PWD: "${COLLABORA_PWD}"
  NEXTCLOUD_CNPG_PWD: "${NEXTCLOUD_CNPG_PWD}"
  NEXTCLOUD_REDIS_PWD: "${NEXTCLOUD_REDIS_PWD}"

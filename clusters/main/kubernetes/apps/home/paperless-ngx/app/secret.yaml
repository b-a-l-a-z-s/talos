---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: paperless-ngx-values
  namespace: paperless-ngx
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  S3URL: "${S3URL}"
  BUCKET: "${S3PREFIX}-paperless-ngx"
  S3ID: "${S3ID}"
  S3KEY: "${S3KEY}"
  PAPERLESS_CNPG_PWD: "${PAPERLESS_CNPG_PWD}"
  # redis.password: the chart does not generate it (unset = public PLACEHOLDER default).
  # Letters and digits only (it ends up in PAPERLESS_REDIS).
  PAPERLESS_REDIS_PWD: "${PAPERLESS_REDIS_PWD}"
  PAPERLESS_ADM_PWD: "${PAPERLESS_ADM_PWD}"

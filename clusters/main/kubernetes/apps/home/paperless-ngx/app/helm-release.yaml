---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 1h
  chart:
    spec:
      chart: paperless-ngx
      version: 17.3.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: paperless-ngx-values
      valuesKey: PAPERLESS_CNPG_PWD
      targetPath: cnpg.main.password
    - kind: Secret
      name: paperless-ngx-values
      valuesKey: PAPERLESS_REDIS_PWD
      targetPath: redis.password
    - kind: Secret
      name: paperless-ngx-values
      valuesKey: PAPERLESS_ADM_PWD
      targetPath: workload.main.podSpec.containers.main.env.PAPERLESS_ADMIN_PASSWORD
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 25m
    persistence:
      data:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 20 1 * * *
      consume:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/apps/paperless-ngx/import
        mountPath: /consume
      media:
        enabled: true
        type: nfs
        server: 192.168.1.49
        path: /mnt/main/apps/paperless-ngx/media
        mountPath: /media                     
    cnpg:
      main:
        cluster:
          singleNode: true
          # One Postgres pod instead of the chart's two: a replica on the same node adds
          # no availability, and the nightly backup to S3 covers the data.
          instances: 1
        #mode: recovery
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 27 1 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
    tika:
      enabled: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PAPERLESS_ADMIN_USER: "Balazs"
                PAPERLESS_ADMIN_MAIL: "${DOMAIN_0_EMAIL}"
                PAPERLESS_CONSUMER_POLLING: "5"
                PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: true
                PAPERLESS_OCR_LANGUAGE: "eng"
                PAPERLESS_OCR_LANGUAGES: "eng"
                PAPERLESS_URL: "https://docs.${DOMAIN_0}"
                PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://*.${DOMAIN_0}"
                PAPERLESS_EMAIL_PARSE_DEFAULT_LAYOUT: "3"
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false   
          hosts:
            - host: docs.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix

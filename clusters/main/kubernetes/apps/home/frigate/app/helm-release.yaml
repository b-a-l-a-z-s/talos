---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: frigate
spec:
  interval: 1h
  chart:
    spec:
      chart: frigate
      version: 20.0.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: frigate-values
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: frigate-values
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: frigate-values
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: frigate-values
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: frigate-values
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 50m
    service:
      webrtc:
        type: LoadBalancer
        loadBalancerIP: ${FRIGATE_IP}
        integrations:
          metallb:
            enabled: true
    credentials:
      s3:
        type: s3
    persistence:
      config:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 10 0 * * *   
      media:
        enabled: true
        path: /mnt/main/Surveillance
        mountPath: /media
        server: 192.168.1.49
        type: nfs 
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
              middlewares:
              - name: authentik
                namespace: traefik-internal
                expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false
              #auth:
              #  type: "authentik"
              #  internalHost: "authentik-http.authentik.svc.cluster.local:10230"
              #  externalHost: "frigate.${DOMAIN_0}"   
          hosts:
            - host: frigate.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix

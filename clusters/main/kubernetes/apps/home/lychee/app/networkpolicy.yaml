---
# Postgres only accepts lychee's pods, its own instances, the CNPG operator and Prometheus (metrics)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lychee-cnpg
  namespace: lychee
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: lychee-app-template-cnpg-main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: lychee
        - podSelector:
            matchLabels:
              cnpg.io/cluster: lychee-app-template-cnpg-main
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
---
# Outgoing for the sync CronJob: only DNS, Nextcloud, Lychee and its Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lychee-sync-egress
  namespace: lychee
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: lychee
      pod.name: sync
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: nextcloud
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: lychee
              pod.name: main
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: lychee-app-template-cnpg-main
      ports:
        - protocol: TCP
          port: 5432
---
# Incoming only from traefik-internal and the sync CronJob (API uploads)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lychee-ingress
  namespace: lychee
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: lychee
      app.kubernetes.io/name: app-template
      pod.name: main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-external
        # Homarr's status ping
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homarr
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: lychee
              pod.name: sync
      ports:
        - protocol: TCP
          port: 8000

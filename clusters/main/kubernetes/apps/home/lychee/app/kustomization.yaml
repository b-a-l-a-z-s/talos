apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sync-credentials.yaml
  - helm-release.yaml
  - uploads-ingress.yaml
  - secret.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: lychee-sync-script
    namespace: lychee
    files:
      - sync.php
generatorOptions:
  disableNameSuffixHash: true
components:
  - ../../../../../components/backup/credentials

---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: lychee-values
  namespace: lychee
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  LYCHEE_APP_KEY: "${LYCHEE_APP_KEY}"
  LYCHEE_CNPG_PWD: "${LYCHEE_CNPG_PWD}"

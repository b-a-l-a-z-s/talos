---
# Secret values for the HelmRelease (valuesFrom), so they stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: mealie-values
  namespace: mealie
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  mealie_CNPG_PWD: "${mealie_CNPG_PWD}"
  mealie_SMTP_PWD: "${mealie_SMTP_PWD}"

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
  namespace: mealie
spec:
  interval: 1h
  chart:
    spec:
      chart: mealie
      version: 28.1.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 20m
  valuesFrom:
    - kind: Secret
      name: backup-credentials
      valuesKey: S3URL
      targetPath: credentials.s3.url
    - kind: Secret
      name: backup-credentials
      valuesKey: BUCKET
      targetPath: credentials.s3.bucket
    - kind: Secret
      name: backup-credentials
      valuesKey: S3ID
      targetPath: credentials.s3.accessKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.secretKey
    - kind: Secret
      name: backup-credentials
      valuesKey: S3KEY
      targetPath: credentials.s3.encrKey
    - kind: Secret
      name: mealie-values
      valuesKey: mealie_CNPG_PWD
      targetPath: cnpg.main.password
    - kind: Secret
      name: mealie-values
      valuesKey: mealie_SMTP_PWD
      targetPath: mealie.api.smtp.password
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m 
    persistence:
      data:
        volsync:
          - name: b2
            type: restic
            credentials: s3
            dest:
              enabled: true                          
            src:
              enabled: true
              trigger:
                schedule: 52 0 * * *
    cnpg:
      main:
        cluster:
          singleNode: true
          # One Postgres pod instead of the chart's two: a replica on the same node adds
          # no availability, and the nightly backup to S3 covers the data.
          instances: 1
        #mode: recovery
        backups:
          enabled: true
          credentials: s3
          scheduledBackups:
            - name: daily-backup
              schedule: "0 59 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
          retentionPolicy: "7d"
        recovery:
          method: object_store
          credentials: s3
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false   
          hosts:
            - host: recipes.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix   
    mealie:
      api:
        general:
          allow_signup: false
        smtp:
          user: "${DOMAIN_0_EMAIL}"
          host: "smtp.gmail.com"
          port: 587
          from_name: Mealie
          from_email: "${DOMAIN_0_EMAIL}"
          # TLS | SSL | NONE
          auth_strategy: TLS                         

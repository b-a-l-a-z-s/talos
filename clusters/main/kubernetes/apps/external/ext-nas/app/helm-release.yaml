---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-nas
  namespace: ext-nas
spec:
  interval: 1h
  chart:
    spec:
      chart: external-service
      version: 18.0.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    service:
      main:
        type: ExternalIP
        externalIP: 192.168.1.49
        integrations:
          traefik:
            enabled: true
            insecureSkipVerify: true
        ports:
          main:
            protocol: https
            port: 443
    ingress:
        main:
          enabled: true
          ingressClassName: internal
          #annotations:
          #  nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          integrations:
            traefik:
              enabled: true
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
            nginx:
              enabled: false  
          hosts:
            - host: nas.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix          

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Garage web UI (TrueNAS app, port 30186) at https://garage.<domain> on the LAN.
# The UI has its own login (enabled in the TrueNAS app settings).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-garage
  namespace: ext-garage
spec:
  interval: 1h
  chart:
    spec:
      chart: external-service
      version: 18.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    global:
      stopAll: false
    TZ: Europe/Brussels
    service:
      main:
        type: ExternalIP
        externalIP: 192.168.1.49
        ports:
          main:
            protocol: http
            port: 30186
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          traefik:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          nginx:
            enabled: false
        hosts:
          - host: garage.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix

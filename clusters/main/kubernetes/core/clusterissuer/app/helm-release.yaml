---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clusterissuer
  namespace: clusterissuer
spec:
  interval: 1h
  chart:
    spec:
      chart: clusterissuer
      version: 12.0.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: clusterissuer-values
      valuesKey: ACME_VALUES
  values:

    clusterIssuer:
      selfSigned:
        enabled: true
        name: "selfsigned"
      # The ACME issuers (incl. Cloudflare tokens) come from secret.yaml via valuesFrom

    ## Remove these if you do NOT want to use clusterissuer
    clusterCertificates:
      # Namespaces in which the certificates must be available
      # Accepts comma-separated regex expressions
      replicationNamespaces: '.*'
      certificates:
        - name: domain-0-wildcard
          enabled: true
          certificateIssuer: domain-0-le-prod
          hosts:
            - ${DOMAIN_0}
            - '*.${DOMAIN_0}'
        - name: domain-1-wildcard
          enabled: true
          certificateIssuer: domain-1-le-prod
          hosts:
            - ${DOMAIN_1}
            - '*.${DOMAIN_1}'
        - name: domain-2-wildcard
          enabled: true
          certificateIssuer: domain-2-le-prod
          hosts:
            - ${DOMAIN_2}
            - '*.${DOMAIN_2}'

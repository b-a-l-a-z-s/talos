# =====================================================================================
# CrowdSec parts are COMMENTED OUT (search for "crowdsec"). Uncomment all three blocks
# together once CrowdSec's LAPI is running and the bouncer key is registered:
#   1. ports.websecure.http.middlewares   (bouncer on every route)
#   2. experimental.plugins               (plugin download)
#   3. the "crowdsec" Middleware in extraObjects
#   4. volumes                             (bouncer key file; needs traefik-external/app/secret.yaml)
# Uncommenting only #1 breaks every route on this instance (middleware missing).
# The Middleware also uses CrowdSec AppSec (WAF) and fails closed: AppSec must be running too.
# Two companions, also commented out (each is safe to uncomment on its own):
#   5. deployment.initContainers          (wait for DNS before the plugin download)
#   6. accessLog.fields                   (keep User-Agent for CrowdSec's bad-user-agent scenarios)
# Also commented out, because a fresh cluster has no Prometheus Operator CRDs yet (the Traefik chart
# refuses to render a ServiceMonitor without them); safe to uncomment once kube-prometheus-stack runs:
#   7. metrics.prometheus.serviceMonitor
#
# Used as the bootstrap copy: clusters/<name>/kubernetes/networking/nginx-external/app/
# (hidden from Flux by .sourceignore; the real traefik-external release takes over).
# =====================================================================================
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
  namespace: traefik-external
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.2.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  # gatus-sidecar (observability/gatus) uses this IngressClass annotation as the default for every
  # "external" Ingress. The chart can't annotate its IngressClass, so patch the rendered object.
  # Normal (public) DNS, so these checks go through Cloudflare and the tunnel like real visitors.
  # The status page is public: hide hostnames, URLs and errors (errors can name other hosts).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: IngressClass
              name: external
            patch: |
              apiVersion: networking.k8s.io/v1
              kind: IngressClass
              metadata:
                name: external
                annotations:
                  gatus.home-operations.com/endpoint: |
                    group: Public
                    ui:
                      hide-hostname: true
                      hide-url: true
                      hide-errors: true
                    alerts:
                      - type: discord
  values:
    deployment:
      replicas: 2
      # # Traefik downloads the CrowdSec plugin once, at startup. After a node reboot it can start
      # # before cluster DNS works, and then runs without the plugin (every route on this instance
      # # fails) until the pod is restarted. Wait for DNS first.
      # initContainers:
        # - name: wait-for-dns
          # image: docker.io/library/busybox:1.38.0
          # command:
            # - sh
            # - -c
            # - until nslookup plugins.traefik.io. >/dev/null 2>&1; do echo "waiting for DNS"; sleep 3; done
          # securityContext:
            # allowPrivilegeEscalation: false
            # capabilities:
              # drop: [ALL]
            # readOnlyRootFilesystem: true
          # resources:
            # requests:
              # cpu: 1m
              # memory: 8Mi
            # limits:
              # memory: 32Mi
    # # CrowdSec bouncer key for the crowdsec middleware (secret.yaml)
    # volumes:
      # - name: crowdsec-bouncer
        # mountPath: /crowdsec
        # type: secret
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: external
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: external
        publishedService:
          enabled: true
      kubernetesCRD:
        enabled: true
        ingressClass: external
        defaultTLSResourcesNamespace: traefik-internal
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
        # Trust X-Forwarded-For from pods (cloudflared), so the real visitor IP reaches
        # the access log (CrowdSec detection) and the bouncer (blocking).
        forwardedHeaders:
          trustedIPs:
            - ${PODNET}
        # http:
          # # CrowdSec bouncer on every route of this instance. Fail-closed: if the plugin
          # # can't load, routes on this entrypoint stop serving instead of going unprotected.
          # middlewares:
            # - traefik-external-crowdsec@kubernetescrd


    # CrowdSec reads these from the pod logs (agent acquisition: traefik-external-*)
    accessLog:
      enabled: true
      # # Keep the User-Agent in the access log (headers are dropped by default and show
      # # as "-"). CrowdSec's bad-user-agent scenarios (sqlmap, nikto, ...) need it.
      # fields:
        # headers:
          # names:
            # User-Agent: keep

    # # Downloaded from plugins.traefik.io at startup
    # experimental:
      # plugins:
        # crowdsec-bouncer:
          # moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          # version: v1.7.1


    # Dashboard at https://traefik-external.${DOMAIN_0}/dashboard/ (trailing slash required).
    # Public traffic reaches this instance through the Cloudflare Tunnel (cloudflared -> this
    # Service). The LAN-only allowlist keeps the dashboard private: tunnel requests come from the
    # cloudflared pod's cluster address, outside 192.168.1.0/24, and get a 403.
    ingressRoute:
      dashboard:
        enabled: true
        # /outpost.goauthentik.io: Authentik login callback (handled by the authentik middleware)
        matchRule: Host(`traefik-external.${DOMAIN_0}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`) || PathPrefix(`/outpost.goauthentik.io`))
        entryPoints: ["websecure"]
        middlewares:
          - name: lan-only
          # The API shows every middleware config, incl. the CrowdSec bouncer key
          - name: authentik
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: lan-only
          namespace: traefik-external
        spec:
          ipAllowList:
            sourceRange:
              - 192.168.1.0/24   # LAN clients; add VPN/other VLAN ranges here if needed
      # Authentik forward-auth for the dashboard (own copy: an IngressRoute can't use
      # traefik-internal's without allowCrossNamespace)
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: authentik
          namespace: traefik-external
        spec:
          forwardAuth:
            address: http://authentik-http.authentik.svc.cluster.local:10230/outpost.goauthentik.io/auth/traefik
            trustForwardHeader: true
      # # CrowdSec bouncer (Traefik plugin). Fetches decisions from the CrowdSec LAPI.
      # - apiVersion: traefik.io/v1alpha1
        # kind: Middleware
        # metadata:
          # name: crowdsec
          # namespace: traefik-external
        # spec:
          # plugin:
            # crowdsec-bouncer:
              # enabled: true
              # # stream: keeps a local copy of decisions, no LAPI call per request
              # crowdsecMode: stream
              # crowdsecLapiScheme: http
              # crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
              # crowdsecLapiKeyFile: /crowdsec/lapi-key
              # # Take the client IP from X-Forwarded-For only when it comes from a pod (cloudflared)
              # forwardedHeadersTrustedIPs:
                # - ${PODNET}
              # # Never block the LAN
              # clientTrustedIPs:
                # - 192.168.1.0/24
              # # WAF: every request is also checked by CrowdSec AppSec. Fails closed when AppSec
              # # errors or is unreachable (it runs 2 replicas); bodies are inspected up to 10 MB.
              # crowdsecAppsecEnabled: true
              # crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
              # crowdsecAppsecFailureBlock: true
              # crowdsecAppsecUnreachableBlock: true

    # Prometheus metrics (entrypoint "metrics", port 9100) on their own in-cluster Service,
    # scraped through a ServiceMonitor for the Traefik dashboard in Grafana
    metrics:
      prometheus:
        service:
          enabled: true
        # serviceMonitor:
          # enabled: true
    service:
      annotations:
        metallb.io/ip-allocated-from-pool: main
        metallb.io/loadBalancerIPs: ${NGINX_EXTERNAL_IP}
        # Lets Blocky (k8s_gateway) resolve the dashboard host; IngressRoutes are invisible to it
        coredns.io/hostname: traefik-external.${DOMAIN_0}
      spec:
        externalTrafficPolicy: Local
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 500Mi

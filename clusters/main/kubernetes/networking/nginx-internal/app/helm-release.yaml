# =====================================================================================
# BOOTSTRAP-ONLY COPY: this is Traefik, not nginx.
# clustertool's bootstrap.go hardcodes this folder path and installs whatever HelmRelease
# it finds here with Helm, before Flux runs. Flux never sees this file (.sourceignore
# hides networking/nginx-*), so there is no duplicate. Once Flux is up, the real
# networking/traefik-internal/app/helm-release.yaml takes over this Helm release (same name and
# namespace) and upgrades it to the full config. Keep .sourceignore in place.
# The ServiceMonitor is commented out: a fresh cluster has no Prometheus Operator CRDs yet, and the
# Traefik chart refuses to render one without them. The real release turns it on once Flux runs.
# =====================================================================================
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-internal
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.2.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  # gatus-sidecar (observability/gatus) uses this IngressClass annotation as the default for every
  # "internal" Ingress. The chart can't annotate its IngressClass, so patch the rendered object.
  # Pods resolve via public DNS, where LAN-only hosts don't exist, so Gatus asks Blocky instead.
  # The status page is public: hide hostnames, URLs and errors (errors can name other hosts).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: IngressClass
              name: internal
            patch: |
              apiVersion: networking.k8s.io/v1
              kind: IngressClass
              metadata:
                name: internal
                annotations:
                  gatus.home-operations.com/endpoint: |
                    group: Internal
                    client:
                      dns-resolver: udp://${BLOCKY_IP}:53
                    ui:
                      hide-hostname: true
                      hide-url: true
                      hide-errors: true
                    alerts:
                      - type: discord
  values:
    deployment:
      replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: internal
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: internal
        publishedService:
          enabled: true
      kubernetesCRD:
        enabled: true
        ingressClass: internal
        defaultTLSResourcesNamespace: traefik-internal
    ports:
      web:
        # nginx: force-ssl-redirect
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
    tlsStore:
      default:
        defaultCertificate:
          secretName: certificate-issuer-domain-0-wildcard
    # Dashboard at https://traefik-internal.${DOMAIN_0}/dashboard/ (trailing slash required).
    # Uses the default wildcard cert via the websecure entrypoint; LAN-only via allowlist.
    ingressRoute:
      dashboard:
        enabled: true
        # /outpost.goauthentik.io: Authentik login callback (handled by the authentik middleware)
        matchRule: Host(`traefik-internal.${DOMAIN_0}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`) || PathPrefix(`/outpost.goauthentik.io`))
        entryPoints: ["websecure"]
        middlewares:
          - name: lan-only
          # The API shows every middleware config, incl. the CrowdSec bouncer key
          - name: authentik
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: lan-only
          namespace: traefik-internal
        spec:
          ipAllowList:
            sourceRange:
              - 192.168.1.0/24   # LAN clients; add VPN/other VLAN ranges here if needed
      # Authentik forward-auth, shared by both Traefik instances. Apps reference it as
      # name: authentik, namespace: traefik-internal, expandObjectName: false
      # (raw Ingress: traefik-internal-authentik@kubernetescrd).
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: authentik
          namespace: traefik-internal
        spec:
          forwardAuth:
            address: http://authentik-http.authentik.svc.cluster.local:10230/outpost.goauthentik.io/auth/traefik
            trustForwardHeader: true
            authResponseHeaders:
              - X-authentik-username
              - X-authentik-groups
              - X-authentik-entitlements
              - X-authentik-email
              - X-authentik-name
              - X-authentik-uid
              - X-authentik-jwt
              - X-authentik-meta-jwks
              - X-authentik-meta-outpost
              - X-authentik-meta-provider
              - X-authentik-meta-app
              - X-authentik-meta-version        
    # Prometheus metrics (entrypoint "metrics", port 9100) on their own in-cluster Service,
    # scraped through a ServiceMonitor for the Traefik dashboard in Grafana
    metrics:
      prometheus:
        service:
          enabled: true
        # serviceMonitor:
          # enabled: true
    service:
      annotations:
        metallb.io/ip-allocated-from-pool: main
        metallb.io/loadBalancerIPs: ${NGINX_INTERNAL_IP}
        # Lets Blocky (k8s_gateway) resolve the dashboard host; IngressRoutes are invisible to it
        coredns.io/hostname: traefik-internal.${DOMAIN_0}
      spec:
        externalTrafficPolicy: Local
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 500Mi

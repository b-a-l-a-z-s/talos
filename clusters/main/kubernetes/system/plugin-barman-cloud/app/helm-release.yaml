apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  # Must run in the operator's namespace, which discovers plugins by their Service there
  namespace: cloudnative-pg
spec:
  interval: 1h
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    crds:
      create: true

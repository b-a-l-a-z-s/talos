apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager # the plugin's gRPC TLS certificates
  interval: 10m
  path: clusters/main/kubernetes/system/plugin-barman-cloud/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster

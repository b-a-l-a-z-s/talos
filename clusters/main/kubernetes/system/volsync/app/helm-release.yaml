apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync
spec:
  interval: 1h
  chart:
    spec:
      chart: volsync
      version: 5.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    configmap:
      dashboard-volsync:
        enabled: false            

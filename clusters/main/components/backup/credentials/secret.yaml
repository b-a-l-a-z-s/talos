---
# Used by the HelmRelease's valuesFrom (credentials.s3.*), so the keys stay out of the HelmRelease object
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  namespace: not-used
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  S3URL: "${S3URL}"
  BUCKET: "${S3PREFIX}-APP"
  S3ID: "${S3ID}"
  S3KEY: "${S3KEY}"

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/component_v1alpha1.json
# Backup credentials for the app's HelmRelease; the bucket is named after the HelmRelease
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - secret.yaml
patches:
  - path: patch.yaml
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
replacements:
  - source:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Secret
          name: backup-credentials
        fieldPaths:
          - metadata.namespace
  - source:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      fieldPath: metadata.name
    targets:
      - select:
          kind: Secret
          name: backup-credentials
        fieldPaths:
          - stringData.BUCKET
        options:
          delimiter: "-"
          index: 1
